
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
            integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Cairo:slnt,wght@-11..11,200..1000&display=swap"
            rel="stylesheet">

        <link rel="stylesheet" href="/style/forms-style/form.css">
    </head>
    <body>
        <div class="container-form full-height">
            <div class="form form-large form-gradient full-height">
                <div class="form-container form-large full-height">
                    <div class="form-logo">
                        <img src="/assets/shield.png" alt="shield-logo">
                    </div>
                    <div
                        class="form-question form-question-title email-title-padding">
                        التسجيل في ورشة العمل
                    </div>
                    <div class="quote quote-primary  quote-primary-padding quote-primary-padding-top ">
                        يرجى تعبئة البيانات التالية بدقة لاكمال تسجيلك سيتم
                        ارسال تاكيد الحضور عبر الرسائل النصيه والبريد الالكتروني
                    </div>

                    <div class="form-all-inputs">

                        <div class="form-input">
                            <input type="text" class="email-input"
                                placeholder="الاسم الرباعي ">

                        </div>
                        <div class="form-input">
                            <input type="text" class="email-input"
                                placeholder="رقم الهوية الوظيفية ">

                        </div>

                        <div class="form-input">
                            <input type="text" class="email-input"
                                placeholder="رقم الجوال ">

                        </div>
                        <div class="form-input">
                            <input type="text" class="email-input"
                                placeholder="البريد الالكتروني ">

                        </div>
                        <div class="form-input">
                            <input type="text" class="email-input"
                                placeholder="نوع العضوية ">

                        </div>

                        <div class="form-input">
                            <input type="text" class="email-input"
                                placeholder="الجنس ">

                        </div>

                        <div class="form-input">
                            <input type="text" class="email-input"
                                placeholder="العمر ">

                        </div>
                    </div>

                    <div class="form-btn-container">
                        <button class="form-btn form-btn-primary btn-full"
                            onclick="goToOPTForm()">
                            <span>←</span>متابعه</button>
                    </div>
                </div>
                <div class="form-footer">
                    <div class="footer-link">تواصل معنا </div>
                    <div class="footer-question">تحتاج مساعدة ؟</div>
                </div>
            </div>
        </div>

        <script src="/js/forms.js"></script>
    </body>
</html>
